name: Publish web-IDE PCB editor assets

# A release has one consumer: the atopile web IDE. Build and test the PCB-only
# editor once, then package those exact bytes as a runtime-less OCI image. The
# web-IDE build copies /pcbjam-assets from this image; it never runs it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag for the selected ref, e.g. v0.2.0"
        required: true

concurrency:
  group: pcbjam-assets-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: atopile/pcbjam-assets

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          if ! printf '%s' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "release tag must look like v1.2.3 (got: $tag)" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    uses: ./.github/workflows/wasm-build.yml
    with:
      opt_level: "-O1"
      build_3d_viewer: "OFF"
      run_tests: true
      upload_output: true

  publish:
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Download tested PCB editor output
        uses: actions/download-artifact@v4
        with:
          name: wasm-output
          path: output

      - name: Log in to GHCR
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.meta.outputs.tag }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=PCBjam web-IDE assets
            org.opencontainers.image.description=PCB-only KiCad WebAssembly bundle for atopile web IDE
            org.opencontainers.image.source=https://github.com/atopile/pcbjam
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.meta.outputs.tag }}

      - name: Build and push asset image
        id: push
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          file: docker/asset-image.Dockerfile
          build-contexts: |
            wasm-output=./output
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PCBJAM_VERSION=${{ needs.meta.outputs.tag }}
            PCBJAM_REVISION=${{ github.sha }}

      - name: Attest image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Record immutable consumer reference
        run: |
          echo "ghcr.io/${IMAGE_NAME}@${{ steps.push.outputs.digest }}" | tee pcbjam-assets-image.txt

      - name: Upload consumer reference
        uses: actions/upload-artifact@v4
        with:
          name: pcbjam-assets-image
          path: pcbjam-assets-image.txt
          retention-days: 90
